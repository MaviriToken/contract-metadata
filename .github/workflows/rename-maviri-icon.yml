name: Rename MAVIRI icon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename MAVIRI icon
        run: |
          mv "icons/eip155:4663/Maviri Token 512.png" \
             "icons/eip155:4663/erc20:0xc22DEe573242f9455403b9225b4Af51a0E68C1e1.png"

          rm -f "icons/eip155:4663/.gitkeep"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Rename MAVIRI token icon" || exit 0
          git push
